# Optionally override any default settings from values.yaml
#vmware_network_name: VM Network33
#vmware_network_id: network-33

tenants:
- name: client-x
  subnets: ["10.46.250.10/21"]
  vms:
  - name: webapp
    ips:
    - 10.46.250.15
    - 10.46.250.16
    ports:
    - port: 3000
    - port: 2222
      mode: tcp # haproxy setting (default mode is http, use tcp for ssh ports)
  - name: mysqldb
    ips:
    - 10.46.250.21
    - 10.46.250.22

- name: client-y
  subnets: ["10.47.250.10/21"]
  # overriding vmnetwork settings for individual tenant
  vmware_network_name: VM Network44
  vmware_network_id: network-44
  vms:
  - name: mysqldb
    ips:
    - 10.47.250.21
    - 10.47.250.22

