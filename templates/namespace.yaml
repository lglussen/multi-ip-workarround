{{- range .Values.customers }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}-proxy
  labels:
    allow-ipaddresspool: {{ .name }}
    secondary-udn: {{ .name }}-secondary
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}-mtv
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    primary-udn: {{ $.Values.primary_udn.name }}
    secondary-udn: {{ .name }}-secondary
{{- end }}
