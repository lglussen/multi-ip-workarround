primary_udn:
  name: primary
  subnets: [ 192.168.200.0/24 ]

# oc get providers -A
provider: v8-tlv2

# network name should be available from vSphere UI
vmware_network_name: VM Network

# extact id from vmware URL: /.*urn:vmomi:Network:(network-16):.*/ --> network-16
vmware_network_id: network-16

# Default Ports to apply to every VM
global_default_ports:
  - port: 443
  - port: 80
  - port: 22
    mode: tcp



